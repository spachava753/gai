# Paths are relative to this package; run go generate ./internal/cloudflare.
package: cloudflare
additional-imports:
  - package: github.com/spachava753/gai/internal/wirejson
generate:
  models: true
  client: true
output-options:
  # EnvelopeMetadata is a projection used before decoding typed answers.
  skip-prune: true
  nullable-type: true
  type-mapping:
    number:
      default:
        type: wirejson.Number
