openapi: 3.0.3
info:
  title: Cerebras Inference API
  description: Cerebras Chat Completions API used by the GAI adapter.
  version: 1.0.0
servers:
  - url: https://api.cerebras.ai
    x-ogen-server-name: default
security:
  - bearerAuth: []
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: Creates a chat completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              x-ogen-sse-event-shape: data-only
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ChatCompletionChunk"
                  - type: string
                    enum:
                      - "[DONE]"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Message"
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        frequency_penalty:
          type: number
          minimum: -2
          maximum: 2
        presence_penalty:
          type: number
          minimum: -2
          maximum: 2
        logit_bias:
          type: object
          additionalProperties:
            type: number
        logprobs:
          type: boolean
        max_completion_tokens:
          type: integer
          minimum: 1
        parallel_tool_calls:
          type: boolean
        prediction:
          $ref: "#/components/schemas/Prediction"
        prompt_cache_key:
          type: string
          maxLength: 1024
        response_format:
          $ref: "#/components/schemas/ResponseFormat"
        seed:
          type: integer
        service_tier:
          $ref: "#/components/schemas/ServiceTier"
        top_logprobs:
          type: integer
          minimum: 0
          maximum: 20
        user:
          type: string
        stop:
          $ref: "#/components/schemas/Stop"
        tools:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/FunctionTool"
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        stream:
          type: boolean
    Stop:
      oneOf:
        - type: string
        - type: array
          maxItems: 4
          items:
            type: string
    ReasoningEffort:
      type: string
      enum:
        - low
        - medium
        - high
        - none
    ServiceTier:
      type: string
      enum:
        - priority
        - default
        - auto
        - flex
    Prediction:
      type: object
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum:
            - content
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/PredictionTextPart"
    PredictionTextPart:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        text:
          type: string
    ResponseFormat:
      oneOf:
        - $ref: "#/components/schemas/ResponseFormatText"
        - $ref: "#/components/schemas/ResponseFormatJSONSchema"
        - $ref: "#/components/schemas/ResponseFormatJSONObject"
    ResponseFormatText:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
    ResponseFormatJSONSchema:
      type: object
      required:
        - type
        - json_schema
      properties:
        type:
          type: string
          enum:
            - json_schema
        json_schema:
          $ref: "#/components/schemas/JSONSchemaFormat"
    JSONSchemaFormat:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          additionalProperties: {}
        strict:
          type: boolean
    ResponseFormatJSONObject:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - json_object
    ToolChoice:
      oneOf:
        - $ref: "#/components/schemas/ToolChoiceMode"
        - $ref: "#/components/schemas/ToolChoiceObject"
    ToolChoiceMode:
      type: string
      enum:
        - none
        - auto
        - required
    ToolChoiceObject:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum:
            - function
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string
    FunctionTool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum:
            - function
        function:
          $ref: "#/components/schemas/FunctionObject"
    FunctionObject:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 64
          pattern: "^[a-zA-Z0-9_-]+$"
        description:
          type: string
        parameters:
          type: object
          additionalProperties: {}
    Message:
      oneOf:
        - $ref: "#/components/schemas/SystemMessage"
        - $ref: "#/components/schemas/UserMessage"
        - $ref: "#/components/schemas/AssistantMessage"
        - $ref: "#/components/schemas/ToolMessage"
      discriminator:
        propertyName: role
        mapping:
          system: "#/components/schemas/SystemMessage"
          user: "#/components/schemas/UserMessage"
          assistant: "#/components/schemas/AssistantMessage"
          tool: "#/components/schemas/ToolMessage"
    SystemMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
        content:
          type: string
    UserMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
        content:
          $ref: "#/components/schemas/UserMessageContent"
    UserMessageContent:
      oneOf:
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/UserContentPart"
    UserContentPart:
      oneOf:
        - $ref: "#/components/schemas/TextContentPart"
        - $ref: "#/components/schemas/ImageContentPart"
    TextContentPart:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        text:
          type: string
    ImageContentPart:
      type: object
      required:
        - type
        - image_url
      properties:
        type:
          type: string
          enum:
            - image_url
        image_url:
          $ref: "#/components/schemas/ImageURL"
    ImageURL:
      type: object
      required:
        - url
      properties:
        url:
          type: string
    AssistantMessage:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - assistant
        content:
          type: string
          nullable: true
        reasoning:
          type: string
          nullable: true
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
    ToolMessage:
      type: object
      required:
        - role
        - content
        - tool_call_id
      properties:
        role:
          type: string
          enum:
            - tool
        content:
          type: string
        tool_call_id:
          type: string
    ToolCall:
      type: object
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - function
        function:
          $ref: "#/components/schemas/ToolCallFunction"
    ToolCallFunction:
      type: object
      required:
        - name
        - arguments
      properties:
        name:
          type: string
        arguments:
          type: string
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - chat.completion
        created:
          type: integer
          format: int64
        model:
          type: string
        system_fingerprint:
          type: string
        service_tier:
          type: string
          nullable: true
        service_tier_used:
          type: string
          nullable: true
          enum:
            - priority
            - default
            - flex
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatChoice"
        usage:
          $ref: "#/components/schemas/Usage"
        time_info:
          $ref: "#/components/schemas/TimeInfo"
    ChatChoice:
      type: object
      required:
        - index
        - finish_reason
        - message
      properties:
        index:
          type: integer
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - content_filter
            - tool_calls
        logprobs:
          $ref: "#/components/schemas/LogProbs"
        message:
          $ref: "#/components/schemas/ResponseMessage"
    ResponseMessage:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - assistant
        content:
          type: string
          nullable: true
        reasoning:
          type: string
          nullable: true
        refusal:
          type: string
          nullable: true
        tool_calls:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ToolCall"
    ChatCompletionChunk:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - chat.completion.chunk
        created:
          type: integer
          format: int64
        model:
          type: string
        system_fingerprint:
          type: string
        service_tier:
          type: string
          nullable: true
        service_tier_used:
          type: string
          nullable: true
          enum:
            - priority
            - default
            - flex
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChunkChoice"
        usage:
          $ref: "#/components/schemas/Usage"
        time_info:
          $ref: "#/components/schemas/TimeInfo"
    ChatCompletionChunkChoice:
      type: object
      required:
        - index
        - delta
      properties:
        index:
          type: integer
        delta:
          $ref: "#/components/schemas/ChatCompletionChunkDelta"
        finish_reason:
          type: string
          nullable: true
          enum:
            - stop
            - length
            - content_filter
            - tool_calls
        logprobs:
          $ref: "#/components/schemas/LogProbs"
    ChatCompletionChunkDelta:
      type: object
      properties:
        role:
          type: string
          enum:
            - assistant
        content:
          type: string
          nullable: true
        reasoning:
          type: string
          nullable: true
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChunkToolCall"
    ChatCompletionChunkToolCall:
      type: object
      required:
        - index
        - function
      properties:
        index:
          type: integer
        id:
          type: string
        type:
          type: string
          enum:
            - function
        function:
          $ref: "#/components/schemas/ChatCompletionChunkToolCallFunction"
    ChatCompletionChunkToolCallFunction:
      type: object
      properties:
        name:
          type: string
        arguments:
          type: string
    LogProbs:
      type: object
      additionalProperties: {}
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        image_tokens:
          type: integer
        prompt_tokens_details:
          $ref: "#/components/schemas/PromptTokensDetails"
        completion_tokens_details:
          $ref: "#/components/schemas/CompletionTokensDetails"
    TimeInfo:
      type: object
      properties:
        queue_time:
          type: number
        prompt_time:
          type: number
        completion_time:
          type: number
        total_time:
          type: number
        created:
          type: number
    PromptTokensDetails:
      type: object
      properties:
        cached_tokens:
          type: integer
    CompletionTokensDetails:
      type: object
      properties:
        reasoning_tokens:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
        param:
          type: string
